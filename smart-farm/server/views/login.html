<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm - เข้าสู่ระบบ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ธีมเดียวกับ dashboard (style.css) — "Liquid Glass" พื้น aurora + การ์ดกระจกโปร่ง
           หน้านี้ไม่ได้โหลด style.css จึงประกาศ token ชุดเล็กไว้เองตรงนี้
           ค่าต้องตรงกับชั้น THEME: LIQUID GLASS ใน style.css */
        :root {
            --primary: #16a34a;
            --primary-hover: #15803d;
            --bg: #f5f7f5;
            --card-bg: #ffffff;
            --border: #e5e9e6;
            --border-strong: #cdd5d0;
            --text: #17201a;
            --text-mid: #5d6a62;

            --glass-bg:      rgba(255,255,255,0.62);
            --glass-bg-soft: rgba(255,255,255,0.42);
            --glass-border:  rgba(255,255,255,0.72);
            --glass-spec:    rgba(255,255,255,0.65);
            --glass-shadow:  0 16px 44px rgba(16,40,28,0.16);
            --glass-blur:    blur(18px) saturate(165%);
        }
        body.dark {
            --bg: #0e1310;
            --card-bg: #151b17;
            --border: #242c27;
            --border-strong: #36413a;
            --text: #e6ece8;
            --text-mid: #919e96;

            --glass-bg:      rgba(30,41,34,0.58);
            --glass-bg-soft: rgba(30,41,34,0.38);
            --glass-border:  rgba(255,255,255,0.10);
            --glass-spec:    rgba(255,255,255,0.16);
            --glass-shadow:  0 16px 44px rgba(0,0,0,0.55);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Sans Thai', 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* พื้นหลัง aurora — ของที่ทำให้การ์ดกระจกมีอะไรให้เบลอ (ชุดเดียวกับ dashboard) */
        body::before {
            content: '';
            position: fixed;
            inset: -10%;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(42% 38% at 18% 14%, rgba(34,197,94,0.20),  transparent 68%),
                radial-gradient(46% 42% at 88% 26%, rgba(13,148,136,0.16), transparent 70%),
                radial-gradient(50% 44% at 62% 92%, rgba(132,204,22,0.15), transparent 72%);
            animation: auroraDrift 70s ease-in-out infinite alternate;
        }
        body.dark::before {
            background:
                radial-gradient(42% 38% at 18% 14%, rgba(34,197,94,0.22),  transparent 68%),
                radial-gradient(46% 42% at 88% 26%, rgba(13,148,136,0.20), transparent 70%),
                radial-gradient(50% 44% at 62% 92%, rgba(101,163,13,0.16), transparent 72%);
        }
        @keyframes auroraDrift {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(2.5%, -2%, 0) scale(1.08); }
        }
        @media (prefers-reduced-motion: reduce) {
            body::before { animation: none; }
        }

        .login-wrapper {
            width: 100%;
            max-width: 380px;
            padding: 20px 16px;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 32px 32px;
            box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-spec);
        }

        /* ไม่รองรับ backdrop-filter = พื้นโปร่ง 60% ทับ aurora แล้วอ่านไม่ออก → กลับไปใช้พื้นทึบ */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .login-card, .farm-logo, .form-control { background: var(--card-bg); border-color: var(--border); }
        }

        .farm-logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(74,222,128,0.30), rgba(22,163,74,0.12));
            border: 1px solid rgba(22,163,74,0.30);
            box-shadow: 0 6px 18px rgba(22,163,74,0.22), inset 0 1px 0 var(--glass-spec);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .login-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            background: linear-gradient(120deg, var(--text) 30%, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-mid);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 500;
            color: var(--text);
            font-size: 0.86rem;
            margin-bottom: 6px;
        }

        /* ⚠️ ขอบห้ามใช้ --glass-border (ขาวโปร่ง) — บนการ์ดกระจกสีขาวช่องจะกลืนหายไป */
        .form-control {
            border-radius: 12px;
            padding: 11px 13px;
            border: 1px solid color-mix(in srgb, var(--text-mid) 34%, transparent);
            background: var(--glass-bg-soft);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 1px 0 var(--glass-spec);
            color: var(--text);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-control::placeholder { color: var(--text-mid); opacity: 0.7; }

        .form-control:focus {
            background: var(--glass-bg);
            color: var(--text);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: linear-gradient(180deg, #22c55e, var(--primary));
            border: 1px solid rgba(22,163,74,0.45);
            color: white;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            box-shadow: 0 6px 18px rgba(22,163,74,0.28), inset 0 1px 0 rgba(255,255,255,0.35);
            margin-top: 8px;
            font-family: inherit;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(22,163,74,0.36), inset 0 1px 0 rgba(255,255,255,0.45);
            filter: saturate(115%);
        }
        .btn-login:active { transform: translateY(0); }

        .error-msg {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.30);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #dc2626;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body.dark .error-msg { color: #f87171; }

        .footer-text {
            text-align: center;
            color: var(--text-mid);
            font-size: 0.78rem;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <!-- ใช้ธีมเดียวกับที่เลือกไว้ใน dashboard (localStorage 'theme') — ต้องอยู่ต้นสุดของ body กันจอกะพริบ -->
    <script>
        try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark'); } catch (e) {}
    </script>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="farm-logo">🌱</div>
            <h1 class="login-title">Smart Farm</h1>
            <p class="login-subtitle">ระบบปลูกผักไฮโดรโปนิกส์อัตโนมัติ</p>

            <div id="error-box" class="error-msg" style="display:none;">
                ⚠️ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
            </div>

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">ชื่อผู้ใช้</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="กรอกชื่อผู้ใช้"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>
                <div class="mb-3">
                    <label class="form-label">รหัสผ่าน</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="กรอกรหัสผ่าน"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
            </form>
        </div>
        <p class="footer-text">Smart Farm Dashboard v1.0</p>
    </div>

    <script>
        if (new URLSearchParams(window.location.search).get('error')) {
            document.getElementById('error-box').style.display = 'flex';
        }
    </script>
</body>
</html>
